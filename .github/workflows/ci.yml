name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -warnaserror:CS8300

      - name: Server tests (integration/regression)
        run: dotnet test tests/QuickShare.Server.Tests --no-build --logger "trx" --results-directory TestResults

      - name: Install Playwright Chromium
        run: pwsh tests/QuickShare.Browser.Tests/bin/Debug/net10.0/playwright.ps1 install chromium --with-deps

      - name: Browser smoke tests
        run: dotnet test tests/QuickShare.Browser.Tests --no-build --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

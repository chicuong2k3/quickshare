name: Server Diag (temp)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: self-hosted
    timeout-minutes: 20

    steps:
      - name: Container + image status
        shell: powershell
        run: |
          cd '${{ secrets.DEV_DEPLOY_PATH }}'
          docker compose ps
          docker compose images quickshare

      - name: Read DB connection from .env and query
        shell: powershell
        run: |
          $env:DEV_DEPLOY_PATH = '${{ secrets.DEV_DEPLOY_PATH }}'
          $envContent = Get-Content (Join-Path $env:DEV_DEPLOY_PATH '.env')
          $line = $envContent | Where-Object { $_ -match '^DB_CONNECTION_STRING=' } | Select-Object -First 1
          if (-not $line) { throw 'DB_CONNECTION_STRING not found in .env' }
          $conn = $line.Substring($line.IndexOf('=') + 1)
          $connInfo = @()
          $password = ''
          foreach ($pair in $conn -split ';') {
            $kv = $pair -split '=', 2
            if ($kv.Count -lt 2) { continue }
            switch ($kv[0].Trim()) {
              'Host'     { $connInfo += 'host='   + $kv[1].Trim() }
              'Port'     { $connInfo += 'port='   + $kv[1].Trim() }
              'Database' { $connInfo += 'dbname=' + $kv[1].Trim() }
              'Username' { $connInfo += 'user='   + $kv[1].Trim() }
              'Password' { $password = $kv[1].Trim() }
            }
          }
          $connArgs = ($connInfo -join ' ')
          Write-Output "conninfo: $($connInfo -replace 'password=[^ ]+', 'password=****')"
          docker run --rm -e "PGPASSWORD=$password" postgres:16-alpine psql "$connArgs" `
            -c 'SELECT column_name, data_type FROM information_schema.columns WHERE table_name IN (''Users'',''PaymentIntents'',''PaymentEvents'',''Subscriptions'') ORDER BY table_name, ordinal_position;' `
            -c 'SELECT "Id", "Plan", "CreatedAt" FROM "Users" ORDER BY "CreatedAt" DESC LIMIT 15;' `
            -c 'SELECT "Id", "UserId", "Plan", "Status", "PayOSOrderCode", "Amount", "CompletedAt" FROM "PaymentIntents" ORDER BY "CreatedAt" DESC LIMIT 15;' `
            -c 'SELECT "Id", "UserId", "EventType", "Plan", "Billing", "Amount", "InvoiceId", "CreatedAt" FROM "PaymentEvents" ORDER BY "CreatedAt" DESC LIMIT 15;' `
            -c 'SELECT u."Email", u."Plan", s."Status", s."Plan" AS sub_plan, s."CurrentPeriodEnd" FROM "Users" u LEFT JOIN "Subscriptions" s ON s."UserId" = u."Id" WHERE u."Plan" IS DISTINCT FROM ''free'' ORDER BY u."CreatedAt" DESC LIMIT 15;'
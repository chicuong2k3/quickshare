name: Deploy to Dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chicuong2k3/quickshare

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 45
    # A superseded image build is pure waste on a single self-hosted runner.
    # Cancelling here is safe: nothing has been deployed yet.
    concurrency:
      group: deploy-dev-build
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=quickshare-dev
          cache-to: type=gha,mode=min,scope=quickshare-dev

  deploy:
    needs: build
    runs-on: self-hosted
    timeout-minutes: 45
    # Never interrupt a deploy in flight — a cancel between `docker compose up`
    # and the container coming back leaves the service down. Newer pushes queue.
    # They cannot deploy stale code: their build cancels the superseded one, and
    # a deploy whose build was cancelled never runs.
    concurrency:
      group: deploy-dev-deploy
      cancel-in-progress: false

    steps:
      # GITHUB_TOKEN cannot PULL user-account ghcr.io packages (denied: denied),
      # so instead of pulling, build the image on the runner from the checked-out
      # source and tag it exactly as compose expects. `up -d` then recreates the
      # container when the digest changes.
      - name: Build image on runner
        shell: powershell
        run: |
          docker build -t ghcr.io/chicuong2k3/quickshare:dev $env:GITHUB_WORKSPACE

      - name: Restart container
        shell: powershell
        run: |
          cd ${{ secrets.DEV_DEPLOY_PATH }}
          docker compose up -d --remove-orphans quickshare
          docker image prune -f
